name: requirements_fact_checker
version: 1
summary: "Исправляет черновик требований по извлечениям до критика: числа, атрибуцию, ссылки на источники."
description: >
  Corrects a requirements draft against the source extracts and returns the
  corrected document. A middle element of a refine loop's body chain (SPEC §10.3):
  it runs between the writer and the critic, so a figure that drifted from its
  source is fixed before the critic ever judges the draft.
consumes:
  - { port: draft, type: requirements@v1, about: "the requirements draft you correct in place, before the critic sees it" }
  - { port: extracts, type: collection<extract@v1>, about: "one extract per input document, made by the source processor; each row carries its Source cell (document, locator, short quote), which is what you check claims and quotes against" }
produces:
  - { port: doc, type: requirements@v1 }
needs: [read, edit]
# The requirements profile (facet SPEC §6): the writer, the corrector and the critic of this
# document type read ONE contract, preloaded at spawn, instead of three copies in three prompts.
skills: [requirements-profile]
defaults:
  timeout_s: 1800
