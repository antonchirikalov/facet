name: pain_mapper
version: 1
description: >
  Writes the pain map: the client's main pains in their words, ranked by the
  evidence of the call, what each costs them, how the proposed solution removes
  it with the requirement and design ids that carry it, how it will show, the
  worries a proposal must answer, the mechanism the client's trust depends on,
  and the pains nothing in the solution answers yet.
consumes:
  - { port: client_voice, type: client_voice@v1, about: "the client voice sheet: section 1 ranks what matters to them, section 2 gives their commitments with weight, section 3 their vocabulary" }
  - { port: requirements, type: requirements@v1, about: "the accepted requirements; cite their ids for every answer" }
  - { port: design, type: design_doc@v1, about: "the accepted design; cite its decision ids (D-NN) where a decision removes a pain" }
  - { port: extracts, type: "collection<extract@v1>", untrusted: true, about: "one extract per input document; quotes are copied from here, verbatim" }
  - { port: draft, type: document@v1, optional: true, about: "your previous draft, on a revision round; answer the numbered remarks by editing it" }
produces:
  - { port: map, type: pain_map@v1 }
needs: [read, edit]
skills: [pain-map-profile]
defaults:
  timeout_s: 1800
