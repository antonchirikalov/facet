[project]
name = "facet"
version = "0.1.0"
description = "Практика подготовки документов на Dynamic Workflows Claude Code: профили типов, эталоны, конвейеры"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  # tools/confluence_publish.py: публикация идёт в REST Confluence напрямую. Импорт
  # ленивый — конвертер и --dry-run обходятся стандартной библиотекой.
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6",
  # tests/test_shrink_png.py: веб-копия рисунка; в воркфлоу инструмент идёт питоном figgybanana
  "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Пакет facet: переименован из collimator 2026-09-20.
packages = ["facet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ is not a package: the gate is a standalone script called by a workflow stage,
# so tests import it by name rather than through facet.
pythonpath = [".", "tools"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
