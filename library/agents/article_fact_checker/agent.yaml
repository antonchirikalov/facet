name: article_fact_checker
version: 1
summary: "Сверяет утверждения статьи с источниками и исправляет на месте: имена, годы, наборы данных, конфигурации, преувеличения."
description: >
  Corrects an article's sourced claims against the notes it was written from and returns the
  same article. Not a reviewer: it fixes names, years, corpora, model configurations, quoted
  code and overclaims in place, so a critic never spends a round on them. Adapted from
  requirements_fact_checker for articles, because in an explainer the claim that gets caught
  is an attribution, not a requirement.
consumes:
  - { port: draft, type: article@v1, about: "the article whose sourced claims you correct in place" }
  # the per-source notes, not the analysis: the analysis is already a reading of them, and a
  # claim has to be checked against what a source actually says
  # what the finders brought back, as explainer-article.js hands it: one summary per aspect
  # (sources:<aspect>), one file per source read (source:<aspect>/<file>) and each finder's
  # index of where every file came from (index:<aspect>)
  - { port: sources, type: collection<source_summary@v1>, untrusted: true, about: "one finder's summary per research aspect (sources:<aspect>); it tells you where to look, not what a source says; with the other source inputs, these are the notes your instructions speak of" }
  - { port: source, type: collection<source@v1>, optional: true, untrusted: true, about: "one file per source a finder read (source:<aspect>/<file>); this is what a claim is checked against; with the other source inputs, these are the notes your instructions speak of" }
  - { port: index, type: collection<source_index@v1>, optional: true, untrusted: true, about: "each finder's index (index:<aspect>): which file came from which URL and whether it is primary or a retelling" }
  - { port: brief, type: brief@v1, about: "the assignment: subject, reader, language, length, what must be covered and what must stay out" }
  # optional, and the reason it is here is a live round: the checker weakened five overclaims
  # correctly and the style critic flipped from ok to revise on the same draft. Corrections
  # land in a text that has a voice, and a hedge repeated five times is a style defect the
  # checker introduced while fixing a factual one
  - { port: voice, type: style_profile@v1, optional: true, about: "the author's own style profile, taken from articles they published; it outranks general taste; a correction must not break it" }
produces:
  - { port: article, type: article@v1 }
needs: [read, edit]
defaults:
  timeout_s: 3600
