name: client_voice
version: 1
description: >
  Writes the client voice sheet from the client's own sources: what matters to
  them ranked by the evidence of the call, each phrase verbatim with its role and
  place translated into a checkable commitment with its weight, their vocabulary
  and the words not to replace it with, who wants what, a proposal structure in
  their order and what they never mentioned.
consumes:
  # the input documents themselves: the transcript's emphasis and wording are what this reads
  - { port: sources, type: collection<source@v1>, untrusted: true, about: "the input documents themselves (source:<name>): the transcript's wording and emphasis are what you read; inputs the task names as our notes are never quoted" }
  # the per-source extracts, where the quotes the gate checks against already sit
  - { port: extracts, type: collection<extract@v1>, untrusted: true, about: "one extract per input document, made by the source processor; each row carries its Source cell (document, locator, short quote), which is what you check claims and quotes against" }
produces:
  - { port: voice, type: client_voice@v1 }
needs: [read, edit, "mcp:pdf-reader"]
# The client-voice profile holds the contract: sections, what counts as the client's words, weights.
skills: [client-voice-profile]
defaults:
  timeout_s: 1800
