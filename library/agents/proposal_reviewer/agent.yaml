name: proposal_reviewer
version: 1
summary: "Независимо проверяет пропозал до автора: покрытие просьб заказчика, противоречия между разделами и рисунками, обещания без плана, утверждения без опоры, голос по профилю."
description: >
  Reviews a client proposal before the author sees it and emits a verdict@v1:
  coverage of every client ask, contradictions between sections and between text
  and figures, promises the plan does not deliver, claims the sources do not
  support, and the proposal profile's voice rules. Opens every figure. Returns
  approved or revise with numbered remarks by severity.
consumes:
  - { port: draft, type: proposal@v1 }
  - { port: coverage, type: coverage_map@v1 }
  - { port: sources, type: collection<source@v1> }
  - { port: figures, type: collection<image@v1> }
  - { port: answers, type: answers@v1, optional: true }
  # the client's words, ranked concerns, weights and vocabulary (client-voice); present once written
  - { port: client_voice, type: client_voice@v1, optional: true }
produces:
  - { port: verdict, type: verdict@v1 }
needs: [read, edit, vision]
# The proposal profile holds the reviewer checklist and the verdict rule.
skills: [proposal-profile]
defaults:
  timeout_s: 2400
