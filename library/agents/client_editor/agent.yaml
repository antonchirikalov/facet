name: client_editor
version: 1
summary: "Делает из внутренних версий требований и дизайна, где у каждой строки указан источник, версии для клиента: убирает источники, служебные метки и следы внутренней работы, сохраняет каждое требование с весом и цитатами клиента, перенумеровывает и ведёт карту номеров."
description: >
  Writes the client edition of a traceable requirements document or solution
  design: drops source locators, tags and every trace of our internal materials
  and process, keeps every requirement with its weight and the client's own words
  as verbatim quotes, renumbers ids without gaps and keeps an id map so the two
  client documents agree.
consumes:
  - { port: traceable, type: requirements@v1, about: "the accepted traceable document (requirements or design) the edition is written from; never edit it" }
  - { port: extracts, type: collection<extract@v1>, about: "one extract per input document, made by the source processor; each row carries its Source cell (document, locator, short quote), which is what you check claims and quotes against" }
  # The design edition only: the requirements edition and its id map, so references agree.
  - { port: requirements_edition, type: client_edition@v1, optional: true, about: "the client edition of the requirements, already written; the design edition must agree with it" }
  - { port: id_map, type: id_map@v1, optional: true, about: "JSON object from every traceable id to its client id; apply it to every requirement reference in the design edition" }
  # the client's words, ranked concerns, weights and vocabulary (client-voice); present once written
  - { port: client_voice, type: client_voice@v1, optional: true, about: "the client voice sheet: their words verbatim, ranked by what mattered to them; section 2 gives each commitment's weight and frequency, section 3 the client's terms and the words not to replace them with" }
produces:
  - { port: edition, type: client_edition@v1 }
needs: [read, edit]
# The client-edition profile holds the contract: what goes, what must survive, the numbering.
skills: [client-edition-profile]
defaults:
  timeout_s: 1800
