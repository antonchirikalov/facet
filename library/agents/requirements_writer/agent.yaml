name: requirements_writer
version: 1
summary: "Пишет единый документ требований из извлечений всех источников; вес каждого требования берёт из сводки «Голос клиента»."
description: >
  Synthesizes a single requirements document from the collection of per-source
  extracts. The body agent of the Extract pipeline's refine loop: it drafts the
  document, a critic reviews it, and on 'revise' it drafts again (loop is Phase
  1; the contract is stable now).
consumes:
  - { port: extracts, type: collection<extract@v1>, about: "one extract per input document, made by the source processor; each row carries its Source cell (document, locator, short quote), which is what you check claims and quotes against" }
  # the client's words, ranked concerns, weights and vocabulary (client-voice); present once written
  - { port: client_voice, type: client_voice@v1, optional: true, about: "the client voice sheet: their words verbatim, ranked by what mattered to them; section 2 gives each commitment's weight and frequency, section 3 the client's terms and the words not to replace them with; take each requirement's weight from it" }
produces:
  - { port: requirements, type: requirements@v1 }
needs: [read, edit, "mcp:tavily-remote"]
# The requirements profile (facet SPEC §6): the writer, the corrector and the critic of this
# document type read ONE contract, preloaded at spawn, instead of three copies in three prompts.
skills: [requirements-profile]
defaults:
  timeout_s: 1800
