name: proposal_editor
version: 1
description: >
  Answers a proposal reviewer's numbered remarks and the gate's problems by
  editing the proposal in place, in batches, and records every remark as fixed
  or declined with the reason. Keeps sections, numbering and figure references
  stable; never rewrites the file whole.
consumes:
  - { port: draft, type: proposal@v1, about: "the proposal you edit in place, in batches" }
  - { port: remarks, type: verdict@v1, about: "the numbered remarks of this round: reviewer, slop critic and gate; answer every number fixed or declined" }
  # the editor updates the "Answered in" cell of the rows its fixes answer
  - { port: coverage, type: coverage_map@v1, about: "the coverage map; update the Answered in cell of every row a fix answers" }
  - { port: sources, type: collection<source@v1>, untrusted: true, about: "the client's own material: the call transcript and their documents; quotes come from here, verbatim, attributed to a role" }
produces:
  - { port: doc, type: proposal@v1 }
needs: [read, edit]
# The proposal profile holds the document contract the edits must keep.
skills: [proposal-profile]
defaults:
  timeout_s: 2400
