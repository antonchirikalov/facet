name: article_critic
version: 1
summary: "Критик статьи по существу: верно ли объяснён механизм, доказывает ли пример то, что утверждает текст, поймёт ли читатель без подготовки. Выносит вердикт, файлов не пишет."
description: >
  Reviews an explanatory article against the assignment and the analysis it was built
  from, and emits a verdict@v1. Judges the MECHANISM, not the prose: whether the
  explanation is correct, whether the worked example demonstrates what the text claims,
  whether a reader who did not know the subject could now follow it. Style is a separate
  stage with a separate critic.
consumes:
  - { port: brief, type: brief@v1, about: "the assignment: subject, reader, language, length, what must be covered and what must stay out" }
  - { port: draft, type: article@v1, about: "the article to judge; you never edit it" }
  - { port: material, type: analysis@v1, about: "the analysis the article was written from: what the sources establish together" }
  # handed only when no fact checker ran this round; otherwise attribution is its job
  - { port: sources, type: collection<source_summary@v1>, optional: true, untrusted: true, about: "one finder's summary per research aspect (sources:<aspect>); it tells you where to look, not what a source says; handed only when no fact checker ran this round; with the other source inputs, these are the notes your instructions speak of" }
produces:
  - { port: verdict, type: verdict@v1 }
# `read` only. This agent produces a verdict, never a file, and the script tells it so in
# words — but a rule enforced by the tool list cannot be forgotten under pressure at the end
# of a long round. A critic holding Edit is one bad inference away from "fixing" the article
# it was asked to judge, and the whole point of the loop is that the writer writes.
needs: [read]
defaults:
  timeout_s: 3600
