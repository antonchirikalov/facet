name: verbatim_writer
version: 1
summary: "Руки скрипта для записей. Скрипт сам файлы не пишет, поэтому записи прогона — круги правки с замечаниями, UNRESOLVED.md, handoff.md — оформляет этот агент: заголовок и пункты ровно как получил, без пересказа. Так незакрытое и переданное остаётся на диске, а не только в логе."
description: >
  Writes a file that records items exactly as it received them: a heading and the items,
  one per line, in the language they arrived in. Adds no judgement, rephrases nothing,
  touches no other file. The pipeline's way of putting an unresolved remark on the record
  instead of letting it disappear when the rounds run out.
consumes: []
produces:
  - { port: document, type: document@v1 }
needs: [read, edit]
defaults:
  timeout_s: 900
