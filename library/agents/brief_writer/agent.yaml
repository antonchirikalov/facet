name: brief_writer
version: 1
summary: "Превращает свободный текст заказа в бриф: тема, читатель, язык, объём, что обязательно и что исключено; разбивает тему на аспекты для поиска."
description: >
  Turns the free text of an order into the brief every downstream agent consumes: the
  subject, the reader, the language, the length, what must be covered and what must stay
  out. Invents nothing the order does not contain, and splits the subject into aspects that
  can be researched in parallel.
consumes: []
produces:
  - { port: brief, type: brief@v1 }
needs: [read, edit]
defaults:
  timeout_s: 1800
