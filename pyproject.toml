[project]
name = "facet"
version = "0.1.0"
description = "Document practice on Claude Code Dynamic Workflows: type profiles, exemplars, pipelines"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  # tools/confluence_publish.py: publishing goes straight to the Confluence REST API. The
  # import is lazy: the converter and --dry-run need only the standard library.
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6",
  # tests/test_shrink_png.py: the web copy of a figure; in a workflow the tool runs on figgybanana's Python
  "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Package facet: renamed from collimator on 2026-09-20.
packages = ["facet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ is not a package: the gate is a standalone script called by a workflow stage,
# so tests import it by name rather than through facet.
pythonpath = [".", "tools"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
