name: source_processor
version: 1
summary: "Разбирает один входной документ (стенограмма, RFP, PDF, заметки, таблица) в извлечение: факты, требования, вопросы, у каждой строки источник."
description: >
  Processes one source document (transcript, RFP, PDF, notes, spreadsheet) into
  a structured extract@v1. The per-item worker of the Extract pipeline: the
  engine fans it out over the scanned source collection via a map node (§10.3).
consumes:
  - { port: source, type: source@v1, about: "the one input document you turn into an extract" }
produces:
  - { port: extract, type: extract@v1 }
needs: [read, edit, vision, "mcp:pdf-reader"]
defaults:
  timeout_s: 1800
