name: requirements_critic
version: 1
summary: "Критик требований: сверяет черновик с намерением источников и выносит вердикт с нумерованными замечаниями."
description: >
  Reviews a requirements draft and emits a verdict@v1. The critic of the Extract
  pipeline's refine loop: it judges the draft against the source extracts' intent
  and returns approved or revise with actionable feedback.
consumes:
  - { port: draft, type: requirements@v1, about: "the requirements draft to judge; you never edit it" }
  - { port: extracts, type: collection<extract@v1>, about: "one extract per input document, made by the source processor; each row carries its Source cell (document, locator, short quote), which is what you check claims and quotes against" }
  # the client's words, ranked concerns, weights and vocabulary (client-voice); present once written
  - { port: client_voice, type: client_voice@v1, optional: true, about: "the client voice sheet: their words verbatim, ranked by what mattered to them; section 2 gives each commitment's weight and frequency, section 3 the client's terms and the words not to replace them with; a weight the sheet gives and the draft drops is a defect" }
produces:
  - { port: verdict, type: verdict@v1 }
needs: [read]
# The requirements profile (facet SPEC §6): the writer, the corrector and the critic of this
# document type read ONE contract, preloaded at spawn, instead of three copies in three prompts.
skills: [requirements-profile]
defaults:
  timeout_s: 1800
