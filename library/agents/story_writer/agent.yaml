name: story_writer
version: 1
description: >
  Writes the day story: the main user's day with the product, step by step in the
  client's words, each step traced to the requirement ids it rests on, with
  screen lines a figure is drawn from, the secondary scenarios, every role, and
  how the product reaches its users. Invents no feature.
consumes:
  - { port: client_voice, type: client_voice@v1, about: "the client voice sheet: who uses the product, what they spent the most time on, their vocabulary" }
  - { port: pain_map, type: pain_map@v1, about: "the pain map: the story shows each top pain removed at a named step" }
  - { port: requirements, type: requirements@v1, about: "the accepted requirements; every step cites the ids it rests on" }
  - { port: design, type: design_doc@v1, about: "the accepted design: how a step works, what needs a signal, what is still open" }
  - { port: draft, type: document@v1, optional: true, about: "your previous draft, on a revision round; answer the numbered remarks by editing it" }
produces:
  - { port: story, type: day_story@v1 }
needs: [read, edit]
skills: [day-story-profile]
defaults:
  timeout_s: 1800
