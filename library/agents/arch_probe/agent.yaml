name: arch_probe
version: 1
description: >
  An enterprise architect that mines a requirements document for architectural
  gaps, contradictions, and unstated trade-offs, then produces workshop-ready
  discovery questions grounded in what the material actually says. May run
  targeted domain research to sharpen the probes.
consumes:
  - { port: requirements, type: requirements@v1, about: "the requirements document to mine for gaps, contradictions and unstated trade-offs" }
produces:
  - { port: arch_report, type: arch_report@v1 }
needs: [read, edit, "mcp:tavily-remote"]
# The discovery-questions profile: the probe that drafts and the critic that curates read ONE
# contract, preloaded at spawn, instead of two copies in two prompts.
skills: [discovery-questions-profile]
defaults:
  timeout_s: 1800
