name: file_copier
version: 1
summary: "Руки скрипта для записи. Скрипт конвейера сам с файлами не работает, а gate-runner создавать их запрещено, поэтому копирует этот агент: снимок черновика после каждого круга, победителя конкурса дизайнов в design.md, применение списка правок писателя через apply_edits.py. У него только Bash: файлы не читает и не судит, выполняет команду и сообщает, что она сделала."
description: >
  Runs the copy commands it is given — and the apply-edits command that lands a writer's
  edits file on a draft — and reports what each one did. One job and no judgement:
  a workflow script has no filesystem, so a snapshot of a file it wants kept has to be made by
  something with a shell. Exists separately from gate_runner because that agent is forbidden to
  create files at all — a rule worth keeping, since breaking it once littered the run directory.
consumes: []
produces:
  - { port: copies, type: gate_report@v1 }
# `bash` and nothing else. It cannot read the file it copies and cannot judge what it copied,
# which is the whole point: a copier that could read is a copier that could decide.
needs: [bash]
defaults:
  timeout_s: 900
